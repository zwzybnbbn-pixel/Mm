<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم الأمنية | شبوة</title>
    <link rel="stylesheet" href="admin-panel.css">
</head>
<body>

    <div id="auth-container" class="login-box">
        <h2>تسجيل دخول المسؤول</h2>
        <input type="email" id="email" placeholder="البريد الإلكتروني">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button id="login-btn">دخول</button>
        <p id="auth-error" style="color: red;"></p>
    </div>

    <div id="dashboard-container" style="display: none;" class="admin-wrapper">
        <header class="admin-header">
            <h2>إدارة البلاغات العاجلة</h2>
            <button id="logout-btn" class="btn-logout">خروج</button>
        </header>

        <section class="editor-section">
            <h3 id="form-title">إضافة بلاغ جديد</h3>
            <input type="hidden" id="news-id">
            <input type="text" id="title" placeholder="عنوان الخبر">
            <textarea id="content" placeholder="نص البلاغ"></textarea>
            <select id="status_type">
                <option value="info">معلومة (أزرق)</option>
                <option value="calm">طمأنة (أخضر)</option>
                <option value="urgent">عاجل (أحمر)</option>
            </select>
            <button id="save-btn" class="btn-primary">نشر البلاغ</button>
            <button id="cancel-btn" style="display:none;">إلغاء التعديل</button>
        </section>

        <section class="list-section">
            <h3>الأخبار المنشورة حالياً</h3>
            <div id="admin-news-list"></div>
        </section>
    </div>

    <script type="module" src="admin-panel.js"></script>
</body>
</html>
