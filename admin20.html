<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم سباير</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0f1e 0%, #1a1f2f 100%);
            min-height: 100vh;
            color: #fff;
        }

        /* Header */
        .header {
            background: rgba(10, 15, 30, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
            padding: 1rem 5%;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo i {
            font-size: 2rem;
            color: #ffd700;
        }

        .logo h2 {
            font-size: 1.5rem;
            color: #ffd700;
        }

        .back-link {
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            border: 1px solid #ffd700;
            border-radius: 30px;
            transition: all 0.3s;
        }

        .back-link:hover {
            background: #ffd700;
            color: #0a0f1e;
        }

        /* Main Container */
        .container {
            margin-top: 100px;
            padding: 2rem 5%;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px;
            padding: 25px;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: #ffd700;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.2);
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #ffd700;
        }

        .stat-info h3 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-info p {
            color: #aaa;
            font-size: 0.9rem;
        }

        /* Charts Row */
        .charts-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .chart-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 25px;
            padding: 25px;
        }

        .chart-card h3 {
            color: #ffd700;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }

        canvas {
            width: 100% !important;
            height: 300px !important;
        }

        /* Tables */
        .table-section {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 25px;
            padding: 25px;
            margin-bottom: 40px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .section-header h3 {
            color: #ffd700;
            font-size: 1.5rem;
        }

        .filter-controls {
            display: flex;
            gap: 15px;
        }

        .filter-controls select,
        .filter-controls input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            padding: 10px 15px;
            color: #fff;
        }

        .filter-controls select option {
            background: #1a1f2f;
        }

        .export-btn {
            background: #ffd700;
            color: #0a0f1e;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .export-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        /* Table Styles */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;
            font-weight: 700;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #ffd700;
        }

        td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
        }

        tr:hover {
            background: rgba(255, 215, 0, 0.05);
        }

        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .status-confirmed {
            background: rgba(0, 255, 0, 0.2);
            color: #00ff00;
            border: 1px solid #00ff00;
        }

        .status-cancelled {
            background: rgba(255, 0, 0, 0.2);
            color: #ff4444;
            border: 1px solid #ff4444;
        }

        .status-pending {
            background: rgba(255, 165, 0, 0.2);
            color: #ffaa00;
            border: 1px solid #ffaa00;
        }

        
        /* تنسيق محسن للأزرار لضمان ظهور الأيقونات */
.action-btn {
    background: rgba(255, 215, 0, 0.1); /* خلفية خفيفة خلف الأيقونة */
    border: 1px solid rgba(255, 215, 0, 0.3);
    color: #ffd700 !important; /* لون ذهبي واضح */
    cursor: pointer;
    margin: 0 5px;
    font-size: 1.2rem; /* تكبير الحجم قليلًا */
    transition: all 0.3s;
    width: 35px;
    height: 35px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.action-btn:hover {
    background: #ffd700;
    color: #0a0f1e !important;
    transform: scale(1.1);
}

.action-btn.delete {
    color: #ff4444 !important;
    border-color: rgba(255, 68, 68, 0.3);
}

.action-btn.delete:hover {
    background: #ff4444;
    color: #fff !important;
}

/* التأكد من أن أيقونات Font Awesome تظهر بشكل صحيح */
.fas, .fab, .fa {
    display: inline-block !important;
    visibility: visible !important;
}


        /* Loading Spinner */
        .loading-spinner {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
        }

        .loading-spinner.active {
            display: block;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 215, 0, 0.3);
            border-radius: 50%;
            border-top-color: #ffd700;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 3000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1f2f 0%, #0a0f1e 100%);
            border: 2px solid #ffd700;
            border-radius: 30px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
        }

        .modal-header {
            text-align: center;
            margin-bottom: 20px;
            color: #ffd700;
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .modal-body p {
            margin: 10px 0;
            color: #aaa;
        }

        .modal-body strong {
            color: #ffd700;
        }

        .modal-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .modal-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .confirm-btn {
            background: #ff4444;
            color: #fff;
        }

        .confirm-btn:hover {
            background: #ff6666;
            transform: scale(1.05);
        }

        .cancel-btn {
            background: #666;
            color: #fff;
        }

        .cancel-btn:hover {
            background: #888;
            transform: scale(1.05);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .charts-row {
                grid-template-columns: 1fr;
            }
            
            .section-header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .filter-controls {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Spinner -->
    <div class="loading-spinner" id="loadingSpinner">
        <div class="spinner"></div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <div class="modal-header">
                <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: #ff4444;"></i>
                <h3>تأكيد الحذف</h3>
            </div>
            <div class="modal-body">
                <p>هل أنت متأكد من حذف هذا الحجز؟</p>
                <p id="deleteBookingInfo"></p>
            </div>
            <div class="modal-actions">
                <button class="modal-btn cancel-btn" onclick="closeDeleteModal()">إلغاء</button>
                <button class="modal-btn confirm-btn" id="confirmDelete">حذف</button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-crown"></i>
                <h2>لوحة تحكم سباير</h2>
            </div>
            <a href="index20.html" class="back-link">
                <i class="fas fa-arrow-right"></i> العودة للموقع
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container">
        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-calendar-check"></i>
                </div>
                <div class="stat-info">
                    <h3 id="totalBookings">0</h3>
                    <p>إجمالي الحجوزات</p>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-users"></i>
                </div>
                <div class="stat-info">
                    <h3 id="totalCustomers">0</h3>
                    <p>عدد العملاء</p>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-futbol"></i>
                </div>
                <div class="stat-info">
                    <h3 id="totalRevenue">0</h3>
                    <p>الإيرادات (ريال)</p>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-star"></i>
                </div>
                <div class="stat-info">
                    <h3 id="avgRating">4.9</h3>
                    <p>متوسط التقييم</p>
                </div>
            </div>
        </div>

        <!-- Charts -->
        <div class="charts-row">
            <div class="chart-card">
                <h3><i class="fas fa-chart-line"></i> الحجوزات اليومية</h3>
                <canvas id="dailyChart"></canvas>
            </div>

            <div class="chart-card">
                <h3><i class="fas fa-chart-pie"></i> توزيع الملاعب</h3>
                <canvas id="stadiumChart"></canvas>
            </div>
        </div>

        <!-- Bookings Table -->
        <div class="table-section">
            <div class="section-header">
                <h3><i class="fas fa-list"></i> جميع الحجوزات</h3>
                <div class="filter-controls">
                    <select id="stadiumFilter" onchange="filterBookings()">
                        <option value="all">جميع الملاعب</option>
                        <option value="big">ملعب كبير</option>
                        <option value="small">ملعب صغير</option>
                    </select>
                    <select id="statusFilter" onchange="filterBookings()">
                        <option value="all">جميع الحالات</option>
                        <option value="confirmed">مؤكد</option>
                        <option value="pending">معلق</option>
                        <option value="cancelled">ملغي</option>
                    </select>
                    <input type="date" id="dateFilter" onchange="filterBookings()">
                    <button class="export-btn" onclick="exportToExcel()">
                        <i class="fas fa-file-excel"></i> تصدير
                    </button>
                </div>
            </div>

            <div class="table-responsive">
                <table id="bookingsTable">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>العميل</th>
                            <th>الجوال</th>
                            <th>التاريخ</th>
                            <th>الساعة</th>
                            <th>الملعب</th>
                            <th>عدد اللاعبين</th>
                            <th>الحالة</th>
                            <th>الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Generated by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // تهيئة Supabase
        const supabaseUrl = 'https://gxuumjhtutkipvkljjhj.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd4dXVtamh0dXRraXB2a2xqamhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU1NTM2MzEsImV4cCI6MjA4MTEyOTYzMX0.rmsSRTQ57cAJ3VAiQMe0mdxEYcERh6zQDep7DN_frFI';
        
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);

        let bookings = [];
        let charts = {};
        let deleteBookingId = null;

        // إظهار/إخفاء التحميل
        function showLoading() {
            document.getElementById('loadingSpinner').classList.add('active');
        }

        function hideLoading() {
            document.getElementById('loadingSpinner').classList.remove('active');
        }

        // جلب الحجوزات
        async function fetchBookings() {
            try {
                showLoading();
                
                const { data, error } = await db
                    .from('bookings')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                
                bookings = data || [];
                return bookings;
            } catch (error) {
                console.error('خطأ في جلب الحجوزات:', error);
                showNotification('حدث خطأ في جلب الحجوزات', 'error');
                return [];
            } finally {
                hideLoading();
            }
        }

        // تحديث الإحصائيات
        function updateStats() {
            // إجمالي الحجوزات
            document.getElementById('totalBookings').textContent = bookings.length;

            // عدد العملاء الفريدين
            const uniqueCustomers = new Set(bookings.map(b => b.customer_phone)).size;
            document.getElementById('totalCustomers').textContent = uniqueCustomers;

            // الإيرادات (افتراضي 300 ريال للحجز)
            const revenue = bookings.length * 300;
            document.getElementById('totalRevenue').textContent = revenue.toLocaleString();

            // تحديث الرسوم البيانية
            updateDailyChart();
            updateStadiumChart();
        }

        // تحديث الرسم البياني اليومي
        function updateDailyChart() {
            const last7Days = [];
            const counts = [];

            for (let i = 6; i >= 0; i--) {
                const date = new Date();
                date.setDate(date.getDate() - i);
                const dateStr = date.toISOString().split('T')[0];
                
                const dayName = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'][date.getDay()];
                last7Days.push(dayName);
                
                const count = bookings.filter(b => b.booking_date === dateStr).length;
                counts.push(count);
            }

            if (charts.daily) {
                charts.daily.destroy();
            }

            const ctx = document.getElementById('dailyChart').getContext('2d');
            charts.daily = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: last7Days,
                    datasets: [{
                        label: 'عدد الحجوزات',
                        data: counts,
                        borderColor: '#ffd700',
                        backgroundColor: 'rgba(255, 215, 0, 0.1)',
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            labels: { color: '#fff' }
                        }
                    },
                    scales: {
                        y: {
                            grid: { color: 'rgba(255, 215, 0, 0.1)' },
                            ticks: { color: '#fff' }
                        },
                        x: {
                            grid: { color: 'rgba(255, 215, 0, 0.1)' },
                            ticks: { color: '#fff' }
                        }
                    }
                }
            });
        }

        // تحديث الرسم البياني للملاعب
        function updateStadiumChart() {
            const bigCount = bookings.filter(b => b.stadium_type === 'big').length;
            const smallCount = bookings.filter(b => b.stadium_type === 'small').length;

            if (charts.stadium) {
                charts.stadium.destroy();
            }

            const ctx = document.getElementById('stadiumChart').getContext('2d');
            charts.stadium = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['ملعب كبير', 'ملعب صغير'],
                    datasets: [{
                        data: [bigCount, smallCount],
                        backgroundColor: ['#ffd700', 'rgba(255, 215, 0, 0.5)'],
                        borderColor: '#ffd700',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            labels: { color: '#fff' }
                        }
                    }
                }
            });
        }

        // عرض الحجوزات في الجدول
        function displayBookings(filteredBookings = bookings) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            filteredBookings.forEach((booking, index) => {
                const row = document.createElement('tr');
                
                const stadiumName = booking.stadium_type === 'big' ? 'كبير' : 'صغير';
                
                let statusClass = 'status-confirmed';
                if (booking.status === 'pending') statusClass = 'status-pending';
                if (booking.status === 'cancelled') statusClass = 'status-cancelled';

                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${booking.customer_name}</td>
                    <td>${booking.customer_phone}</td>
                    <td>${booking.booking_date}</td>
                    <td>${booking.booking_time}</td>
                    <td>${stadiumName}</td>
                    <td>${booking.players_count}</td>
                    <td><span class="status-badge ${statusClass}">${booking.status === 'confirmed' ? 'مؤكد' : booking.status === 'pending' ? 'معلق' : 'ملغي'}</span></td>
                    <td>
                        <button class="action-btn" onclick="viewBooking('${booking.id}')" title="عرض">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button class="action-btn" onclick="editBooking('${booking.id}')" title="تعديل">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="action-btn delete" onclick="showDeleteModal('${booking.id}', '${booking.customer_name}')" title="حذف">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                `;

                tbody.appendChild(row);
            });
        }

        // تصفية الحجوزات
        function filterBookings() {
            const stadium = document.getElementById('stadiumFilter').value;
            const status = document.getElementById('statusFilter').value;
            const date = document.getElementById('dateFilter').value;

            let filtered = [...bookings];

            if (stadium !== 'all') {
                filtered = filtered.filter(b => b.stadium_type === stadium);
            }

            if (status !== 'all') {
                filtered = filtered.filter(b => b.status === status);
            }

            if (date) {
                filtered = filtered.filter(b => b.booking_date === date);
            }

            displayBookings(filtered);
        }

        // عرض تفاصيل الحجز
        function viewBooking(id) {
            const booking = bookings.find(b => b.id === id);
            if (!booking) return;

            const stadiumName = booking.stadium_type === 'big' ? 'كبير' : 'صغير';
            const statusText = booking.status === 'confirmed' ? 'مؤكد' : booking.status === 'pending' ? 'معلق' : 'ملغي';

            alert(`
                تفاصيل الحجز:
                ==============
                العميل: ${booking.customer_name}
                الجوال: ${booking.customer_phone}
                التاريخ: ${booking.booking_date}
                الساعة: ${booking.booking_time}
                الملعب: ${stadiumName}
                عدد اللاعبين: ${booking.players_count}
                الحالة: ${statusText}
                تاريخ الحجز: ${new Date(booking.created_at).toLocaleString('ar-SA')}
            `);
        }

        // تعديل الحجز
        async function editBooking(id) {
            const booking = bookings.find(b => b.id === id);
            if (!booking) return;

            const newStatus = prompt('تغيير حالة الحجز (confirmed/pending/cancelled):', booking.status);
            
            if (newStatus && ['confirmed', 'pending', 'cancelled'].includes(newStatus)) {
                try {
                    showLoading();
                    
                    const { error } = await db
                        .from('bookings')
                        .update({ status: newStatus })
                        .eq('id', id);

                    if (error) throw error;

                    showNotification('تم تحديث الحجز بنجاح', 'success');
                    await loadData();
                } catch (error) {
                    console.error('خطأ في تحديث الحجز:', error);
                    showNotification('حدث خطأ في تحديث الحجز', 'error');
                } finally {
                    hideLoading();
                }
            }
        }

        // إظهار نافذة تأكيد الحذف
        function showDeleteModal(id, customerName) {
            deleteBookingId = id;
            document.getElementById('deleteBookingInfo').textContent = `حجز: ${customerName}`;
            document.getElementById('deleteModal').classList.add('active');
        }

        // إغلاق نافذة الحذف
        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('active');
            deleteBookingId = null;
        }

        // تأكيد الحذف
        document.getElementById('confirmDelete').addEventListener('click', async () => {
            if (!deleteBookingId) return;

            try {
                showLoading();
                
                const { error } = await db
                    .from('bookings')
                    .delete()
                    .eq('id', deleteBookingId);

                if (error) throw error;

                showNotification('تم حذف الحجز بنجاح', 'success');
                closeDeleteModal();
                await loadData();
            } catch (error) {
                console.error('خطأ في حذف الحجز:', error);
                showNotification('حدث خطأ في حذف الحجز', 'error');
            } finally {
                hideLoading();
            }
        });

        // تصدير إلى Excel
        function exportToExcel() {
            let csv = 'العميل,الجوال,التاريخ,الساعة,الملعب,عدد اللاعبين,الحالة\n';
            
            bookings.forEach(booking => {
                const stadiumName = booking.stadium_type === 'big' ? 'كبير' : 'صغير';
                const statusText = booking.status === 'confirmed' ? 'مؤكد' : booking.status === 'pending' ? 'معلق' : 'ملغي';
                
                csv += `"${booking.customer_name}",${booking.customer_phone},${booking.booking_date},${booking.booking_time},${stadiumName},${booking.players_count},${statusText}\n`;
            });

            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            
            link.setAttribute('href', url);
            link.setAttribute('download', `حجوزات_سباير_${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // إظهار الإشعارات
        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                left: 20px;
                background: ${type === 'success' ? 'rgba(0, 255, 0, 0.2)' : 'rgba(255, 0, 0, 0.2)'};
                border: 2px solid ${type === 'success' ? '#00ff00' : '#ff4444'};
                color: ${type === 'success' ? '#00ff00' : '#ff4444'};
                padding: 15px 25px;
                border-radius: 10px;
                font-weight: 600;
                z-index: 4000;
                backdrop-filter: blur(10px);
            `;
            notification.innerHTML = `
                <i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i>
                <span style="margin-right: 10px;">${message}</span>
            `;
            document.body.appendChild(notification);
            
            setTimeout(() => notification.remove(), 3000);
        }

        // تحميل البيانات
        async function loadData() {
            await fetchBookings();
            updateStats();
            displayBookings();
        }

        // تهيئة الصفحة
        loadData();

        // تحديث تلقائي كل 30 ثانية
        setInterval(loadData, 30000);
    </script>
</body>
</html>
