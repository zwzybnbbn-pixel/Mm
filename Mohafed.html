<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أعمال المحافظ | لوحة الإنجازات</title>
    <link rel="stylesheet" href="mohafed.css">
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container">
            <div class="header-content">
                <h1>أعمال وإنجازات المحافظ</h1>
                <p>نظرة شاملة على المشاريع والإحصائيات والانجازات التي تحققت على أرض الواقع</p>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- Statistics Section -->
        <section class="stats-section">
            <div class="stats-grid" id="statsContainer">
                <!-- سيتم ملؤها ديناميكياً -->
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>جاري تحميل الإحصائيات...</p>
                </div>
            </div>
        </section>

        <!-- Projects Section -->
        <section class="projects-section">
            <div class="section-header">
                <h2 class="section-title">المشاريع المنفذة</h2>
                <div class="filters">
                    <button class="filter-btn active" data-filter="all">الكل</button>
                    <button class="filter-btn" data-filter="تحت التنفيذ">تحت التنفيذ</button>
                    <button class="filter-btn" data-filter="مكتمل">مكتمل</button>
                    <button class="filter-btn" data-filter="مخطط له">مخطط له</button>
                </div>
            </div>

            <div class="projects-grid" id="projectsContainer">
                <!-- سيتم ملؤها ديناميكياً -->
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>جاري تحميل المشاريع...</p>
                </div>
            </div>
        </section>
    </div>

    <script>
        // متغيرات التطبيق
        let allProjects = [];
        let allStats = [];
        let currentFilter = 'all';
        const SUPABASE_URL = 'https://gxuumjhtutkipvkljjhj.supabase.co'
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd4dXVtamh0dXRraXB2a2xqamhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU1NTM2MzEsImV4cCI6MjA4MTEyOTYzMX0.rmsSRTQ57cAJ3VAiQMe0mdxEYcERh6zQDep7DN_frFI';

        // تهيئة التطبيق
        document.addEventListener('DOMContentLoaded', () => {
            initializeApp();
            setupEventListeners();
        });

        // إعداد مستمعي الأحداث
        function setupEventListeners() {
            // فلترة المشاريع
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    // إزالة النشاط من جميع الأزرار
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    // إضافة النشاط للزر المضغوط
                    btn.classList.add('active');
                    // تطبيق الفلتر
                    currentFilter = btn.dataset.filter;
                    filterProjects(currentFilter);
                });
            });
        }

        // تهيئة التطبيق
        async function initializeApp() {
            await loadStats();
            await loadProjects();
        }

        // تحميل الإحصائيات من Supabase
        async function loadStats() {
            const statsContainer = document.getElementById('statsContainer');
            
            try {
                // استعلام REST API بدلاً من استخدام SDK
                const response = await fetch(`${SUPABASE_URL}/rest/v1/stats?select=*`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                allStats = data;
                renderStats(data);

            } catch (error) {
                console.error('Error loading stats:', error);
                // عرض بيانات تجريبية في حالة الخطأ
                const sampleStats = [
                    { id: 1, label: 'المشاريع المنفذة', value: 24 },
                    { id: 2, label: 'الميزانية الإجمالية', value: 85000000 },
                    { id: 3, label: 'عدد المستفيدين', value: 8500 },
                    { id: 4, label: 'معدل الإنجاز', value: 76 }
                ];
                allStats = sampleStats;
                renderStats(sampleStats);
                
                statsContainer.innerHTML += `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>تم تحميل بيانات تجريبية</p>
                    </div>
                `;
            }
        }

        // عرض الإحصائيات
        function renderStats(stats) {
            const statsContainer = document.getElementById('statsContainer');
            
            if (!stats || stats.length === 0) {
                statsContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-chart-line"></i>
                        <h3>لا توجد إحصائيات متاحة حالياً</h3>
                    </div>
                `;
                return;
            }

            // أيقونات لكل نوع من الإحصائيات
            const iconMap = {
                'المشاريع المنفذة': 'fas fa-project-diagram',
                'الميزانية الإجمالية': 'fas fa-money-bill-wave',
                'عدد المستفيدين': 'fas fa-users',
                'المناطق المستهدفة': 'fas fa-map-marker-alt',
                'المقاولين': 'fas fa-hard-hat',
                'معدل الإنجاز': 'fas fa-chart-line',
                'التكلفة': 'fas fa-coins',
                'الوقت': 'fas fa-clock'
            };

            const statsHTML = stats.map(stat => `
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="${iconMap[stat.label] || 'fas fa-chart-bar'}"></i>
                    </div>
                    <div class="stat-value">${formatStatValue(stat.value, stat.label)}</div>
                    <div class="stat-label">${stat.label}</div>
                </div>
            `).join('');

            statsContainer.innerHTML = statsHTML;
        }

        // تنسيق قيمة الإحصائية
        function formatStatValue(value, label) {
            if (label.includes('الميزانية') || label.includes('التكلفة')) {
                return new Intl.NumberFormat('ar-SA').format(value) + ' ريال';
            } else if (label.includes('معدل')) {
                return value + '%';
            }
            return new Intl.NumberFormat('ar-SA').format(value);
        }

        // تحميل المشاريع من Supabase
        async function loadProjects() {
            const projectsContainer = document.getElementById('projectsContainer');
            
            try {
                // استعلام REST API بدلاً من استخدام SDK
                const response = await fetch(`${SUPABASE_URL}/rest/v1/projects?select=*`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                allProjects = data;
                renderProjects(data);

            } catch (error) {
                console.error('Error loading projects:', error);
                // عرض بيانات تجريبية في حالة الخطأ
                const sampleProjects = [
                    { 
                        id: 1, 
                        title: 'مشروع تطوير البنية التحتية', 
                        description: 'تحسين شبكات الطرق والمرافق الأساسية في المنطقة الصناعية', 
                        status: 'مكتمل',
                        image_url: 'https://images.unsplash.com/photo-1541888946425-d81bb19240f5'
                    },
                    { 
                        id: 2, 
                        title: 'برنامج الدعم الاجتماعي', 
                        description: 'تقديم مساعدات مالية للأسر المحتاجة وتحسين مستوى المعيشة', 
                        status: 'تحت التنفيذ',
                        image_url: 'https://images.unsplash.com/photo-1577896851231-70ef18881754'
                    },
                    { 
                        id: 3, 
                        title: 'مبادرة التعليم الرقمي', 
                        description: 'توفير أجهزة وتدريب للطلاب على التقنيات الحديثة', 
                        status: 'مخطط له',
                        image_url: 'https://images.unsplash.com/photo-1523050854058-8df90110c9f1'
                    }
                ];
                allProjects = sampleProjects;
                renderProjects(sampleProjects);
            }
        }

        // عرض المشاريع
        function renderProjects(projects) {
            const projectsContainer = document.getElementById('projectsContainer');
            
            if (!projects || projects.length === 0) {
                projectsContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-folder-open"></i>
                        <h3>لا توجد مشاريع متاحة حالياً</h3>
                        <p>سيتم إضافة المشاريع قريباً</p>
                    </div>
                `;
                return;
            }

            const projectsHTML = projects.map(project => `
                <div class="project-card" data-status="${project.status}">
                    <div class="project-image">
                        <img src="${getProjectImage(project.image_url)}" 
                             alt="${project.title}"
                             onerror="this.src='https://images.unsplash.com/photo-1541888946425-d81bb19240f5'">
                    </div>
                    <div class="project-content">
                        <h3 class="project-title">${project.title}</h3>
                        <p class="project-description">${project.description || 'لا يوجد وصف متاح لهذا المشروع حالياً.'}</p>
                        <div class="project-footer">
                            <div class="project-status ${getStatusClass(project.status)}">
                                ${project.status}
                            </div>
                            <button class="view-details" onclick="viewProjectDetails(${project.id})" style="
                                background: none;
                                border: none;
                                color: var(--primary);
                                font-weight: 500;
                                cursor: pointer;
                                display: flex;
                                align-items: center;
                                gap: 8px;
                            ">
                                <i class="fas fa-arrow-left"></i>
                                التفاصيل
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');

            projectsContainer.innerHTML = projectsHTML;
        }

        // الحصول على صورة المشروع
        function getProjectImage(imageUrl) {
            if (!imageUrl || imageUrl.trim() === '') {
                return 'https://images.unsplash.com/photo-1541888946425-d81bb19240f5';
            }
            return imageUrl;
        }

        // فلترة المشاريع
        function filterProjects(filter) {
            let filteredProjects;
            
            if (filter === 'all') {
                filteredProjects = allProjects;
            } else {
                filteredProjects = allProjects.filter(project => project.status === filter);
            }
            
            renderProjects(filteredProjects);
        }

        // الحصول على كلاس حالة المشروع
        function getStatusClass(status) {
            const statusMap = {
                'مكتمل': 'status-completed',
                'تحت التنفيذ': 'status-in-progress',
                'مخطط له': 'status-planned'
            };
            return statusMap[status] || 'status-planned';
        }

        // عرض تفاصيل المشروع
        function viewProjectDetails(projectId) {
            const project = allProjects.find(p => p.id === projectId);
            if (project) {
                alert(`تفاصيل المشروع:\n\nالعنوان: ${project.title}\n\nالوصف: ${project.description || 'لا يوجد وصف'}\n\nالحالة: ${project.status}`);
            }
        }

    
        
    </script>
</body>
</html>
