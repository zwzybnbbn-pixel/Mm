<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام مدرسة رواد المستقبل | الإدارة الذكية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* المتغيرات الأساسية */
        :root {
            --burgundy: #800020;
            --beige: #F8F8F4;
            --white: #ffffff;
            --gray-light: #e5e7eb;
            --blue-main: #1e40af;
            --pink-light: #fdf2f8;
            --blue-light: #eff6ff;
        }

        /* التنسيق العام */
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--beige);
            margin: 0;
            padding: 0;
            padding-bottom: 40px;
            direction: rtl;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* الهيدر */
        nav {
            background-color: var(--burgundy);
            color: white;
            padding: 15px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-home {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
        }

        /* البطاقات */
        .custom-card {
            background: white;
            border-radius: 24px;
            border: 1px solid var(--gray-light);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            padding: 30px;
            margin-top: 30px;
            text-align: center;
        }

        .step-hidden { display: none !important; }

        /* الأزرار */
        .grid-selection {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .btn-gender {
            width: 160px;
            padding: 24px;
            border-radius: 16px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-male { background-color: var(--blue-light); border-color: #dbeafe; color: #1e40af; }
        .btn-female { background-color: var(--pink-light); border-color: #fce7f3; color: #9d174d; }

        .btn-gender span { display: block; font-size: 40px; margin-bottom: 10px; }

        /* الجداول */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            font-size: 14px;
        }

        th, td {
            border: 1px solid var(--gray-light);
            padding: 12px;
            text-align: center;
        }

        th { background-color: #f9fafb; color: var(--burgundy); font-weight: bold; }
        .bg-burgundy-table { background-color: var(--burgundy) !important; color: white; }

        /* شبكة الطلاب */
        .students-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .student-card {
            background: white;
            padding: 15px;
            border-radius: 15px;
            border: 1px solid var(--gray-light);
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .student-card:hover { border-color: var(--burgundy); transform: translateY(-3px); }

        .avatar {
            width: 40px;
            height: 40px;
            background: #f3f4f6;
            color: var(--burgundy);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-weight: bold;
        }

        /* صناديق الحضور */
        .attendance-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .attend-box { padding: 15px; border-radius: 15px; border: 2px solid; }
        .box-green { background: #f0fdf4; border-color: #dcfce7; color: #15803d; }
        .box-red { background: #fef2f2; border-color: #fee2e2; color: #b91c1c; }

        /* ريسبونسيف للجوال */
        @media (max-width: 600px) {
            .grid-selection { flex-direction: column; align-items: center; }
            .btn-gender { width: 100%; }
            .students-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <nav>
        <div class="container nav-content">
            <h1 style="font-size: 20px; font-weight: bold; margin: 0;">🏫 نظام رواد المستقبل</h1>
            <button onclick="location.reload()" class="btn-home">الرئيسية</button>
        </div>
    </nav>

    <div class="container">

        <section id="step-1" class="custom-card">
            <h2 style="color: var(--burgundy); font-weight: 900; margin-bottom: 25px;">اختر القسم</h2>
            <div class="grid-selection">
                <button onclick="setGender('بنين')" class="btn-gender btn-male">
                    <span>👨‍🎓</span> <b>بنين</b>
                </button>
                <button onclick="setGender('بنات')" class="btn-gender btn-female">
                    <span>👩‍🎓</span> <b>بنات</b>
                </button>
            </div>
        </section>

        <section id="step-2" class="step-hidden custom-card" style="text-align: right;">
            <h2 style="color: var(--burgundy); margin-bottom: 20px;">تحديد الصف والشعبة</h2>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;">
                <div>
                    <label style="display: block; font-size: 14px; font-weight: bold; margin-bottom: 8px;">اختر الصف:</label>
                    <select id="grade-select" style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd;">
                        <option value="الخامس">الصف الخامس الابتدائي</option>
                    </select>
                </div>
                <div>
                    <label style="display: block; font-size: 14px; font-weight: bold; margin-bottom: 8px;">اختر الشعبة:</label>
                    <div style="display: flex; gap: 10px;">
                        <button onclick="loadStudents('أ')" style="flex: 1; padding: 12px; background: var(--burgundy); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold;">شعبة (أ)</button>
                        <button onclick="loadStudents('ب')" style="flex: 1; padding: 12px; background: #eee; border: none; border-radius: 10px; cursor: pointer; font-weight: bold;">شعبة (ب)</button>
                    </div>
                </div>
            </div>
            <p onclick="goToStep(1)" style="margin-top: 20px; color: #999; cursor: pointer; text-decoration: underline; font-size: 13px;">← العودة</p>
        </section>

        <section id="step-3" class="step-hidden" style="margin-top: 30px;">
            <div style="display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px; border-radius: 12px; border: 1px solid #ddd;">
                <h3 id="list-title" style="margin: 0; color: var(--burgundy); font-weight: bold;"></h3>
                <button onclick="goToStep(2)" style="font-size: 11px; background: #eee; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer;">تغيير</button>
            </div>
            <div id="students-grid" class="students-grid"></div>
        </section>

        <section id="step-4" class="step-hidden custom-card" style="padding: 0; overflow: hidden;">
            <div style="background: var(--burgundy); color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center;">
                <div style="display: flex; align-items: center; gap: 15px; text-align: right;">
                    <div id="det-avatar" class="avatar" style="background: white; margin: 0; width: 50px; height: 50px; font-size: 20px;"></div>
                    <div>
                        <h2 id="det-name" style="margin: 0; font-size: 18px;"></h2>
                        <span id="det-meta" style="font-size: 11px; opacity: 0.8;"></span>
                    </div>
                </div>
                <button onclick="goToStep(3)" style="background: rgba(255,255,255,0.2); border: none; color: white; width: 30px; height: 30px; border-radius: 50%; cursor: pointer;">✕</button>
            </div>

            <div style="padding: 15px; background: #f9fafb; border-bottom: 1px solid #eee; display: flex; justify-content: space-between;">
                <select id="month-select" onchange="renderGrades()" style="padding: 5px 10px; border-radius: 5px;">
                    <option value="سبتمبر">سبتمبر</option>
                    <option value="مارس" selected>مارس</option>
                </select>
                <button onclick="showYearlySummary()" style="background: var(--blue-main); color: white; border: none; padding: 8px 12px; border-radius: 8px; font-size: 11px; cursor: pointer;">📊 المحصلة السنوية</button>
            </div>

            <div style="padding: 20px;">
                <div id="attendance-box" class="attendance-grid"></div>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th style="text-align: right;">المادة</th>
                                <th>اختبار (40)</th>
                                <th>مواظبة (10)</th>
                                <th class="bg-burgundy-table">المحصلة (50)</th>
                            </tr>
                        </thead>
                        <tbody id="grades-body"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section id="step-5" class="step-hidden custom-card" style="border: 2px solid var(--blue-main); padding: 0; overflow: hidden;">
            <div style="background: var(--blue-main); color: white; padding: 20px;">
                <h2 style="margin: 0;">كشف أعمال السنة</h2>
                <p id="yearly-student-name" style="font-size: 13px; opacity: 0.9; margin-top: 5px;"></p>
            </div>
            <div style="padding: 20px;">
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr style="background: #f3f4f6;">
                                <th style="text-align: right;">المادة</th>
                                <th>ف1 (50)</th>
                                <th>ف2 (50)</th>
                                <th style="background: #fef3c7; color: #92400e;">المجموع (100)</th>
                                <th>التقدير</th>
                            </tr>
                        </thead>
                        <tbody id="yearly-body"></tbody>
                    </table>
                </div>
                <button onclick="goToStep(4)" style="width: 100%; margin-top: 20px; padding: 15px; background: #374151; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold;">← العودة</button>
            </div>
        </section>
    </div>

    <script>
        const studentsDB = {
            1: {
                name: "ماجد قاسم مبارك", gender: "بنين", grade: "الخامس", section: "أ",
                monthlyData: {
                    "سبتمبر": { attend: 22, absent: 0, grades: { "القرآن": [38, 10], "الرياضيات": [40, 10], "العربية": [39, 10], "العلوم": [37, 9] } },
                    "مارس": { attend: 21, absent: 1, grades: { "القرآن": [39, 10], "الرياضيات": [38, 10], "العربية": [40, 10], "العلوم": [38, 10] } }
                }
            },
            2: {
                name: "أحمد علي سالم", gender: "بنين", grade: "الخامس", section: "ب",
                monthlyData: {
                    "سبتمبر": { attend: 15, absent: 7, grades: { "القرآن": [20, 5], "الرياضيات": [15, 4], "العربية": [18, 5], "العلوم": [20, 6] } },
                    "مارس": { attend: 18, absent: 4, grades: { "القرآن": [30, 8], "الرياضيات": [28, 7], "العربية": [32, 8], "العلوم": [31, 7] } }
                }
            },
            3: {
                name: "فاطمة الزهراء", gender: "بنات", grade: "الخامس", section: "ب",
                monthlyData: {
                    "سبتمبر": { attend: 22, absent: 0, grades: { "القرآن": [40, 10], "الرياضيات": [40, 10], "العربية": [40, 10], "العلوم": [40, 10] } },
                    "مارس": { attend: 22, absent: 0, grades: { "القرآن": [40, 10], "الرياضيات": [39, 10], "العربية": [40, 10], "العلوم": [40, 10] } }
                }
            },
            4: {
                name: "زهراء علي", gender: "بنات", grade: "الخامس", section: "أ",
                monthlyData: {
                    "سبتمبر": { attend: 22, absent: 0, grades: { "القرآن": [40, 10], "الرياضيات": [40, 10], "العربية": [40, 10], "العلوم": [40, 10] } },
                    "مارس": { attend: 22, absent: 0, grades: { "القرآن": [40, 10], "الرياضيات": [39, 10], "العربية": [40, 10], "العلوم": [40, 10] } }
                }
            }
        };

        let currentStudentId = null;
        let currentGender = '';

        function goToStep(s) {
            for(let i=1; i<=5; i++) {
                const el = document.getElementById('step-'+i);
                if(el) el.classList.add('step-hidden');
            }
            document.getElementById('step-'+s).classList.remove('step-hidden');
            window.scrollTo(0, 0);
        }

        function setGender(g) { currentGender = g; goToStep(2); }

        function loadStudents(sec) {
            const grid = document.getElementById('students-grid');
            grid.innerHTML = '';
            document.getElementById('list-title').innerText = `طلاب شعبة (${sec})`;
            Object.keys(studentsDB).forEach(id => {
                const s = studentsDB[id];
                if(s.gender === currentGender && s.section === sec) {
                    const card = document.createElement('div');
                    card.className = "student-card";
                    card.onclick = () => showDetails(id);
                    card.innerHTML = `<div class="avatar">${s.name[0]}</div><p style="font-size: 12px; font-weight: bold; margin: 0;">${s.name}</p>`;
                    grid.appendChild(card);
                }
            });
            goToStep(3);
        }

        function showDetails(id) {
            currentStudentId = id;
            const s = studentsDB[id];
            document.getElementById('det-name').innerText = s.name;
            document.getElementById('det-avatar').innerText = s.name[0];
            document.getElementById('det-meta').innerText = `الصف الخامس | شعبة ${s.section}`;
            renderGrades();
            goToStep(4);
        }

        function renderGrades() {
            const month = document.getElementById('month-select').value;
            const table = document.getElementById('grades-body');
            const attendanceBox = document.getElementById('attendance-box');
            const student = studentsDB[currentStudentId];
            const data = student.monthlyData[month] || { attend: 0, absent: 0, grades: {} };

            attendanceBox.innerHTML = `
                <div class="attend-box box-green">
                    <small>حضور</small><br><b style="font-size: 20px;">${data.attend}</b>
                </div>
                <div class="attend-box box-red">
                    <small>غياب</small><br><b style="font-size: 20px;">${data.absent}</b>
                </div>
            `;

            table.innerHTML = '';
            const subjects = [
                { label: "القرآن الكريم", key: "القرآن" },
                { label: "الرياضيات", key: "الرياضيات" },
                { label: "اللغة العربية", key: "العربية" },
                { label: "العلوم", key: "العلوم" }
            ];

            subjects.forEach(sub => {
                const g = data.grades[sub.key] || [0, 0];
                const total = g[0] + g[1];
                table.innerHTML += `
                    <tr>
                        <td style="text-align: right; font-weight: bold;">${sub.label}</td>
                        <td>${g[0]}</td>
                        <td>${g[1]}</td>
                        <td style="font-weight: bold; color: var(--burgundy); background: #f9fafb;">${total}</td>
                    </tr>
                `;
            });
        }

        function showYearlySummary() {
            const s = studentsDB[currentStudentId];
            document.getElementById('yearly-student-name').innerText = `الطالب: ${s.name}`;
            const body = document.getElementById('yearly-body');
            body.innerHTML = '';
            const subjects = ["القرآن الكريم", "الرياضيات", "اللغة العربية", "العلوم"];
            subjects.forEach(sub => {
                body.innerHTML += `
                    <tr>
                        <td style="text-align: right; font-weight: bold;">${sub}</td>
                        <td>48</td>
                        <td>49</td>
                        <td style="font-weight: bold; color: #b91c1c; background: #fffbeb;">97</td>
                        <td style="color: var(--blue-main); font-weight: bold;">ممتاز</td>
                    </tr>`;
            });
            goToStep(5);
        }
    </script>
</body>
</html>
