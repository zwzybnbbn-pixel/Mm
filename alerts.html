<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>التنبيهات – كهرباء عتق</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff4d4d;
            --primary-light: #ff8080;
            --bg: #0b0f1a;
            --card-bg: rgba(255,255,255,0.06);
            --border: rgba(255,255,255,0.08);
            --text: #fff;
            --muted: #aaa;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
            height: 100%;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(160deg, #03050a 0%, #0b0f1a 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 15px;
            padding-bottom: 30px;
        }

        /* ========== SVG Icons ========== */
        .icon {
            display: inline-block;
            width: 1em;
            height: 1em;
            vertical-align: middle;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .icon-lg { width: 1.4em; height: 1.4em; }
        .icon-2x { width: 2em; height: 2em; }
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ========== Back Button ========== */
        .back-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            background: rgba(255,77,77,0.25);
            backdrop-filter: blur(10px);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: 0.2s;
        }
        .back-btn:active {
            transform: scale(0.93);
            background: rgba(255,77,77,0.4);
        }

        /* ========== Header ========== */
        .page-header {
            margin: 65px 0 30px;
            text-align: center;
        }
        .main-title {
            font-size: 1.9rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .subtitle {
            font-size: 0.85rem;
            color: var(--muted);
            margin-top: 5px;
        }

        /* ========== Stats ========== */
        .stats-bar {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
            gap: 8px;
        }
        .stat-item {
            background: rgba(255,255,255,0.04);
            border-radius: 18px;
            padding: 12px 10px;
            text-align: center;
            flex: 1;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .stat-item .count {
            display: block;
            font-size: 1.7rem;
            font-weight: 800;
            color: var(--primary);
        }
        .stat-item .label {
            font-size: 0.65rem;
            color: var(--muted);
        }

        /* ========== Filters ========== */
        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 22px;
            overflow-x: auto;
            padding: 0 5px;
        }
        .filter-btn {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            color: #ccc;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(5px);
        }
        .filter-btn.active {
            background: rgba(255,77,77,0.2);
            color: var(--primary);
            border-color: var(--primary);
        }

        /* ========== Alerts List ========== */
        .alerts-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .alert-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 18px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            transition: 0.2s;
            animation: fadeUp 0.35s ease forwards;
            opacity: 0;
        }
        .alert-card:active {
            background: rgba(255,255,255,0.09);
            transform: scale(0.99);
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffe0e0;
        }

        .alert-text {
            font-size: 0.9rem;
            line-height: 1.7;
            color: rgba(255,255,255,0.92);
            margin-bottom: 14px;
        }

        .meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        .priority-badge, .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
        }
        .priority-high {
            background: rgba(255,77,77,0.2);
            color: #ff8080;
        }
        .priority-medium {
            background: rgba(255,165,0,0.2);
            color: #ffa726;
        }
        .priority-low {
            background: rgba(0,162,255,0.2);
            color: #4db8ff;
        }
        .status-active {
            background: rgba(46,204,113,0.2);
            color: #2ecc71;
        }
        .status-urgent {
            background: rgba(255,0,0,0.2);
            color: #ff4d4d;
            animation: pulse 2s infinite;
        }
        .status-inactive {
            background: rgba(108,117,125,0.2);
            color: #9aa0a6;
        }
        @keyframes pulse {
            0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; }
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <a href="index2.html" class="back-btn" aria-label="رجوع">
        <svg class="icon icon-lg" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </a>

    <div class="page-header">
        <h1 class="main-title">
            <svg class="icon icon-2x" viewBox="0 0 24 24" style="stroke:var(--primary);"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            التنبيهات
        </h1>
        <p class="subtitle">آخر المستجدات والإنذارات</p>
    </div>

    <div class="stats-bar">
        <div class="stat-item"><span class="count" id="totalCount">0</span><span class="label">الكل</span></div>
        <div class="stat-item"><span class="count" id="urgentCount">0</span><span class="label">عاجل</span></div>
        <div class="stat-item"><span class="count" id="activeCount">0</span><span class="label">نشط</span></div>
    </div>

    <div class="filters">
        <button class="filter-btn active" data-filter="all">الكل</button>
        <button class="filter-btn" data-filter="urgent">عاجلة</button>
        <button class="filter-btn" data-filter="active">نشطة</button>
        <button class="filter-btn" data-filter="inactive">منتهية</button>
    </div>

    <div id="contentContainer"></div>

    <script type="module">
        import { supabase } from './supabase.js';

        const contentContainer = document.getElementById('contentContainer');
        const totalCount = document.getElementById('totalCount');
        const urgentCount = document.getElementById('urgentCount');
        const activeCount = document.getElementById('activeCount');
        const filterBtns = document.querySelectorAll('.filter-btn');

        let allAlerts = [];
        let currentFilter = 'all';

        // ========== SVG Helper ==========
        function iconSVG(viewBox, path, className = 'icon') {
            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute("viewBox", viewBox);
            svg.classList.add(...className.split(' '));
            const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
            p.setAttribute("d", path);
            svg.appendChild(p);
            return svg;
        }

        function clearContainer() {
            while (contentContainer.firstChild) contentContainer.removeChild(contentContainer.firstChild);
        }

        // ========== Filter & Stats ==========
        function updateStats(alerts) {
            totalCount.textContent = alerts.length;
            urgentCount.textContent = alerts.filter(a => a.urgent).length;
            activeCount.textContent = alerts.filter(a => a.active && !a.urgent).length;
        }

        function applyFilter() {
            let filtered = [...allAlerts];
            if (currentFilter === 'urgent') filtered = filtered.filter(a => a.urgent);
            else if (currentFilter === 'active') filtered = filtered.filter(a => a.active && !a.urgent);
            else if (currentFilter === 'inactive') filtered = filtered.filter(a => !a.active);
            renderAlerts(filtered);
        }

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                applyFilter();
            });
        });

        // ========== Render Alerts ==========
        function renderAlerts(alerts) {
            clearContainer();
            updateStats(alerts);

            if (!alerts.length) {
                const empty = document.createElement('div');
                empty.className = 'empty-state';
                empty.appendChild(iconSVG("0 0 24 24", "M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9 M13.73 21a2 2 0 0 1-3.46 0", "icon icon-2x"));
                const p = document.createElement('p');
                p.textContent = 'لا توجد تنبيهات حالياً';
                empty.appendChild(p);
                contentContainer.appendChild(empty);
                return;
            }

            const container = document.createElement('div');
            container.className = 'alerts-container';

            alerts.forEach((alert, index) => {
                const { title, content, active, urgent, priority } = alert;

                // Status badge
                let statusClass = 'status-inactive';
                let statusIconPath = "M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2z M12 6v6l4 2";
                let statusText = 'منتهي';
                if (urgent) {
                    statusClass = 'status-urgent';
                    statusIconPath = "M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z M12 9v4 M12 17h.01";
                    statusText = 'عاجل';
                } else if (active) {
                    statusClass = 'status-active';
                    statusIconPath = "M13 2L3 14h9l-1 8 10-12h-9l1-8z";
                    statusText = 'نشط';
                }

                // Priority badge
                let priorityClass = 'priority-high';
                let priorityLabel = 'عالية';
                if (priority === 'medium') {
                    priorityClass = 'priority-medium';
                    priorityLabel = 'متوسطة';
                } else if (priority === 'low') {
                    priorityClass = 'priority-low';
                    priorityLabel = 'منخفضة';
                }

                const card = document.createElement('div');
                card.className = 'alert-card';
                card.style.animationDelay = (index * 0.05) + 's';

                // Title
                const titleEl = document.createElement('div');
                titleEl.className = 'card-title';
                titleEl.appendChild(iconSVG("0 0 24 24", "M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z M12 9v4 M12 17h.01"));
                titleEl.appendChild(document.createTextNode(' ' + (title || 'تنبيه')));
                card.appendChild(titleEl);

                // Content
                const contentEl = document.createElement('div');
                contentEl.className = 'alert-text';
                contentEl.textContent = content || 'لا توجد تفاصيل';
                card.appendChild(contentEl);

                // Meta row (priority + status)
                const metaRow = document.createElement('div');
                metaRow.className = 'meta-row';

                const priorityBadge = document.createElement('span');
                priorityBadge.className = `priority-badge ${priorityClass}`;
                priorityBadge.appendChild(iconSVG("0 0 24 24", "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"));
                priorityBadge.appendChild(document.createTextNode(' ' + priorityLabel));
                metaRow.appendChild(priorityBadge);

                const statusBadge = document.createElement('span');
                statusBadge.className = `status-badge ${statusClass}`;
                statusBadge.appendChild(iconSVG("0 0 24 24", statusIconPath));
                statusBadge.appendChild(document.createTextNode(' ' + statusText));
                metaRow.appendChild(statusBadge);

                card.appendChild(metaRow);
                container.appendChild(card);
            });

            contentContainer.appendChild(container);
        }

        // ========== Load Data ==========
        async function loadAlerts() {
            clearContainer();
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'empty-state';
            loadingDiv.appendChild(iconSVG("0 0 24 24", "M12 2v4 M12 18v4 M4.93 4.93l2.83 2.83 M16.24 16.24l2.83 2.83 M2 12h4 M18 12h4 M4.93 19.07l2.83-2.83 M16.24 7.76l2.83-2.83", "icon icon-lg spin"));
            const loadText = document.createElement('p');
            loadText.textContent = 'جاري جلب التنبيهات...';
            loadingDiv.appendChild(loadText);
            contentContainer.appendChild(loadingDiv);

            try {
                const { data, error } = await supabase
                    .from('alerts')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                allAlerts = data || [];
                // ترتيب تنازلي افتراضي حسب الأهمية: عاجل أولاً ثم نشط ثم منتهي
                allAlerts.sort((a, b) => {
                    if (a.urgent && !b.urgent) return -1;
                    if (!a.urgent && b.urgent) return 1;
                    if (a.active && !b.active) return -1;
                    if (!a.active && b.active) return 1;
                    return 0; // يحافظ على ترتيب التاريخ
                });

                applyFilter();
            } catch (error) {
                console.error(error);
                clearContainer();
                const errDiv = document.createElement('div');
                errDiv.className = 'empty-state';
                errDiv.appendChild(iconSVG("0 0 24 24", "M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z M12 9v4 M12 17h.01", "icon icon-2x"));
                const msg = document.createElement('p');
                msg.textContent = 'فشل تحميل التنبيهات';
                errDiv.appendChild(msg);
                const retryBtn = document.createElement('button');
                retryBtn.textContent = 'إعادة المحاولة';
                retryBtn.style.cssText = 'margin-top:12px; padding:10px 20px; background:#ff4d4d; border:none; border-radius:30px; color:white; font-weight:600; cursor:pointer;';
                retryBtn.addEventListener('click', loadAlerts);
                errDiv.appendChild(retryBtn);
                contentContainer.appendChild(errDiv);
            }
        }

        // ========== Realtime & Init ==========
        function init() {
            loadAlerts();
            supabase
                .channel('alerts-live')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'alerts' }, () => loadAlerts())
                .subscribe();

            setInterval(loadAlerts, 30000);
        }

        init();
    </script>
</body>
</html>
