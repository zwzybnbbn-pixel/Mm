<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>سبب الانقطاع – كهرباء عتق</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0066ff;
            --primary-light: #4d94ff;
            --primary-dark: #0047cc;
            --secondary: #00e6e6;
            --accent: #ff6b35;
            --success: #00cc66;
            --warning: #ff9900;
            --danger: #ff3333;
            --dark: #0a0e1a;
            --darker: #050913;
            --light: #ffffff;
            --gray: #8c8c8c;
            --card-bg: rgba(255, 255, 255, 0.07);
            --card-border: rgba(255, 255, 255, 0.12);
            --shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-text-size-adjust: 100%;
            touch-action: manipulation;
        }
        html {
            font-size: 16px;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            height: 100%;
            overflow-x: hidden;
        }
        body {
            font-family: 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
            color: var(--light);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            display: flex;
            flex-direction: column;
        }
        .scroll-container {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 100px;
        }
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }

        /* أيقونات SVG مضمّنة بدلاً من Font Awesome */
        .icon {
            display: inline-block;
            width: 1.2em;
            height: 1.2em;
            vertical-align: middle;
            fill: currentColor;
        }
        .icon-lg { width: 1.5em; height: 1.5em; }
        .icon-2x { width: 2em; height: 2em; }

        /* باقي التنسيقات كما هي مع تعديل بسيط للكاردات */
        .back-btn {
            position: fixed;
            top: max(15px, env(safe-area-inset-top));
            right: 15px;
            background: var(--primary);
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            border: none;
            font-size: 20px;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
        }
        .back-btn:active { transform: scale(0.92); background: var(--primary-dark); }
        .page-header {
            padding: 70px 20px 30px;
            text-align: center;
            background: linear-gradient(135deg, rgba(0, 102, 255, 0.1) 0%, transparent 100%);
            position: relative;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .electric-wave {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, transparent 0%, var(--primary-light) 20%, var(--secondary) 50%, var(--primary-light) 80%, transparent 100%);
            opacity: 0.4; filter: blur(6px);
        }
        .main-title {
            font-size: 2.2rem; font-weight: 800; margin-bottom: 10px;
            background: linear-gradient(135deg, var(--light), var(--secondary));
            -webkit-background-clip: text; background-clip: text;
            color: transparent; line-height: 1.2;
        }
        .subtitle {
            font-size: 0.95rem; color: rgba(255,255,255,0.8); margin-top: 8px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .status-bar {
            display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
            margin: 0 15px 25px;
        }
        .status-badge {
            background: rgba(255,255,255,0.08); padding: 10px 18px; border-radius: 50px;
            font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
        }
        .reasons-container { padding: 0 15px; display: flex; flex-direction: column; gap: 16px; }
        .reason-card {
            background: var(--card-bg); border-radius: 20px; padding: 20px;
            backdrop-filter: blur(10px); box-shadow: var(--shadow);
            border: 1px solid var(--card-border);
            transition: 0.3s; position: relative; overflow: hidden;
            animation: fadeInUp 0.4s ease forwards; opacity: 0;
        }
        .reason-card:nth-child(1) { animation-delay: 0.05s; }
        .reason-card:nth-child(2) { animation-delay: 0.1s; }
        .reason-card:nth-child(3) { animation-delay: 0.15s; }
        .reason-card:nth-child(4) { animation-delay: 0.2s; }
        .reason-card:nth-child(5) { animation-delay: 0.25s; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .reason-card::before {
            content: ''; position: absolute; top: 0; right: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary)); opacity: 0.8;
        }
        .reason-card.resolved::before { background: linear-gradient(90deg, var(--success), #00e676); }
        .reason-card.pending::before { background: linear-gradient(90deg, var(--warning), #ffb74d); }
        .reason-card:active { transform: scale(0.98); background: rgba(255,255,255,0.1); }
        .reason-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 15px; flex-wrap: wrap; gap: 10px;
        }
        .reason-text {
            font-size: 1.1rem; font-weight: 700; color: var(--light);
            line-height: 1.5; flex: 1; min-width: 200px;
            display: flex; align-items: center; gap: 8px;
        }
        .reason-status {
            font-size: 0.8rem; font-weight: 700; padding: 5px 14px; border-radius: 20px;
            white-space: nowrap; display: flex; align-items: center; gap: 5px;
        }
        .status-resolved {
            background: rgba(0,204,102,0.15); color: var(--success);
            border: 1px solid rgba(0,204,102,0.3);
        }
        .status-pending {
            background: rgba(255,153,0,0.15); color: var(--warning);
            border: 1px solid rgba(255,153,0,0.3);
        }
        .reason-details { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
        .detail-row {
            display: flex; align-items: center; gap: 10px; font-size: 0.9rem;
            color: rgba(255,255,255,0.85); background: rgba(255,255,255,0.05);
            padding: 10px 14px; border-radius: 12px; flex-wrap: wrap;
        }
        .detail-row .icon { color: var(--secondary); font-size: 1rem; width: 20px; text-align: center; }
        .detail-row strong { color: var(--light); margin-left: 5px; }
        .time-estimate { color: #4ecdc4 !important; font-weight: 600; }
        .reason-footer {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 15px; font-size: 0.8rem; color: rgba(255,255,255,0.5);
            border-top: 1px solid rgba(255,255,255,0.05); padding-top: 12px;
        }
        .empty-state, .error-state {
            text-align: center; padding: 40px 20px; background: rgba(255,255,255,0.04);
            border-radius: 24px; margin: 20px 15px;
            border: 1px dashed rgba(255,255,255,0.15); backdrop-filter: blur(5px);
        }
        .empty-state .icon, .error-state .icon { font-size: 3rem; margin-bottom: 15px; display: block; }
        .empty-state .icon { color: var(--secondary); }
        .error-state .icon { color: var(--danger); }
        .loading-spinner { text-align: center; padding: 50px; }
        .spinner {
            width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(10,14,26,0.96); backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.08);
            display: flex; justify-content: space-around;
            padding: 12px 0 max(12px, env(safe-area-inset-bottom));
            z-index: 1000;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            text-decoration: none; color: rgba(255,255,255,0.5); flex: 1;
            padding: 5px 0; transition: 0.2s;
        }
        .nav-item.active { color: var(--secondary); }
        .nav-item:active { color: var(--secondary); transform: translateY(-2px); }
        .nav-icon { font-size: 1.3rem; margin-bottom: 4px; }
        .nav-label { font-size: 0.7rem; font-weight: 600; }
    </style>
</head>
<body>
    <div class="scroll-container" id="scrollContainer">
        <a href="index2.html" class="back-btn" aria-label="رجوع">
            <!-- أيقونة السهم باستخدام SVG -->
            <svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </a>

        <div class="page-header">
            <div class="electric-wave"></div>
            <h1 class="main-title">
                <svg class="icon icon-2x" viewBox="0 0 24 24" fill="none" stroke="var(--secondary)" stroke-width="2" style="vertical-align: middle; margin-left: 10px;"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                أسباب الانقطاع
            </h1>
            <p class="subtitle">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="9" x2="9" y2="9"/><line x1="15" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/></svg>
                قائمة بالأسباب المعتمدة من الإدارة
            </p>
        </div>

        <div class="status-bar">
            <div class="status-badge">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="var(--secondary)" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1.5"/><circle cx="4" cy="12" r="1.5"/><circle cx="4" cy="18" r="1.5"/></svg>
                <span id="totalReasons">الأسباب: --</span>
            </div>
            <div class="status-badge">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="var(--secondary)" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                <span id="lastUpdateTime">آخر تحديث: --</span>
            </div>
        </div>

        <div class="reasons-container" id="reasonsBox"></div>
    </div>

    <nav class="bottom-nav">
        <a href="index2.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            <span class="nav-label">الرئيسية</span>
        </a>
        <a href="alerts.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="nav-label">التنبيهات</span>
        </a>
        <a href="reports.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
            <span class="nav-label">البلاغات</span>
        </a>
        <a href="reasons.html" class="nav-item active">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            <span class="nav-label">الانقطاع</span>
        </a>
    </nav>

    <script type="module">
        import { supabase } from './supabase.js';

        const reasonsBox = document.getElementById('reasonsBox');
        const totalReasonsEl = document.getElementById('totalReasons');
        const lastUpdateTimeEl = document.getElementById('lastUpdateTime');

        function formatDate(dateString) {
            if (!dateString) return "—";
            try {
                const date = new Date(dateString);
                if (isNaN(date.getTime())) return "تاريخ غير صالح";
                return date.toLocaleString("ar-EG", { year: "numeric", month: "long", day: "numeric", hour: "2-digit", minute: "2-digit" });
            } catch (e) { return "—"; }
        }

        function createElement(tag, classes = '', attributes = {}) {
            const el = document.createElement(tag);
            if (classes) el.className = classes;
            Object.entries(attributes).forEach(([key, val]) => el.setAttribute(key, val));
            return el;
        }

        function clearBox() {
            while (reasonsBox.firstChild) reasonsBox.removeChild(reasonsBox.firstChild);
        }

        // SVG helper
        function iconSVG(viewBox, path) {
            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute("viewBox", viewBox);
            svg.setAttribute("fill", "none");
            svg.setAttribute("stroke", "currentColor");
            svg.setAttribute("stroke-width", "2");
            svg.classList.add("icon");
            const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
            p.setAttribute("d", path);
            svg.appendChild(p);
            return svg;
        }

        function showLoading() {
            clearBox();
            const container = createElement('div', 'loading-spinner');
            const spinner = createElement('div', 'spinner');
            const text = createElement('p'); text.style.opacity = '0.8'; text.textContent = '⏳ جاري تحميل الأسباب...';
            container.appendChild(spinner);
            container.appendChild(text);
            reasonsBox.appendChild(container);
        }

        function showEmpty() {
            clearBox();
            const emptyDiv = createElement('div', 'empty-state');
            const icon = iconSVG("0 0 24 24", "M22 11.08V12a10 10 0 1 1-5.93-9.14 M22 4L12 14.01l-3-3");
            icon.classList.add("icon-2x");
            emptyDiv.appendChild(icon);
            const p = createElement('p'); p.textContent = 'لا توجد أسباب مسجلة حالياً';
            const small = createElement('small'); small.textContent = 'كل الأمور على ما يرام، لم يتم تسجيل أي انقطاع حتى الآن';
            emptyDiv.appendChild(p); emptyDiv.appendChild(small);
            reasonsBox.appendChild(emptyDiv);
            totalReasonsEl.textContent = 'الأسباب: 0';
            lastUpdateTimeEl.textContent = 'آخر تحديث: —';
        }

        function showError(message = 'خطأ في الاتصال بقاعدة البيانات') {
            clearBox();
            const errorDiv = createElement('div', 'error-state');
            const icon = iconSVG("0 0 24 24", "M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z M12 9v4 M12 17h.01");
            icon.classList.add("icon-2x");
            errorDiv.appendChild(icon);
            const p = createElement('p'); p.textContent = '⚠️ ' + message;
            const small = createElement('small'); small.textContent = 'يرجى التأكد من اتصالك بالإنترنت والمحاولة مرة أخرى';
            errorDiv.appendChild(p); errorDiv.appendChild(small);
            reasonsBox.appendChild(errorDiv);
            totalReasonsEl.textContent = 'الأسباب: --';
            lastUpdateTimeEl.textContent = 'آخر تحديث: --';
        }

        function createReasonCard(reason) {
            const isResolved = reason.status === 'تم الحل';
            const card = createElement('div', `reason-card ${isResolved ? 'resolved' : 'pending'}`);

            // Header
            const header = createElement('div', 'reason-header');
            const reasonText = createElement('span', 'reason-text');
            const warnIcon = iconSVG("0 0 24 24", "M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z M12 9v4 M12 17h.01");
            warnIcon.style.color = 'var(--accent)';
            reasonText.appendChild(warnIcon);
            reasonText.appendChild(document.createTextNode(' ' + (reason.text || 'سبب غير محدد')));
            header.appendChild(reasonText);

            const statusBadge = createElement('span', `reason-status ${isResolved ? 'status-resolved' : 'status-pending'}`);
            const statusIcon = isResolved
                ? iconSVG("0 0 24 24", "M22 11.08V12a10 10 0 1 1-5.93-9.14 M22 4L12 14.01l-3-3")
                : iconSVG("0 0 24 24", "M12 2v4 M12 18v4 M4.93 4.93l2.83 2.83 M16.24 16.24l2.83 2.83 M2 12h4 M18 12h4 M4.93 19.07l2.83-2.83 M16.24 7.76l2.83-2.83");
            statusBadge.appendChild(statusIcon);
            statusBadge.appendChild(document.createTextNode(' ' + (reason.status || (isResolved ? 'تم الحل' : 'قيد المعالجة'))));
            header.appendChild(statusBadge);
            card.appendChild(header);

            // Details
            const details = createElement('div', 'reason-details');
            if (reason.details) {
                const row = createElement('div', 'detail-row');
                row.appendChild(iconSVG("0 0 24 24", "M4 6h16M4 12h16M4 18h7"));
                const span = createElement('span');
                const strong = createElement('strong'); strong.textContent = 'التفاصيل:';
                span.appendChild(strong);
                span.appendChild(document.createTextNode(' ' + reason.details));
                row.appendChild(span);
                details.appendChild(row);
            }
            if (reason.affected_areas) {
                const row = createElement('div', 'detail-row');
                row.appendChild(iconSVG("0 0 24 24", "M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z M12 10a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"));
                const span = createElement('span');
                const strong = createElement('strong'); strong.textContent = 'المناطق المتأثرة:';
                span.appendChild(strong);
                span.appendChild(document.createTextNode(' ' + reason.affected_areas));
                row.appendChild(span);
                details.appendChild(row);
            }
            if (reason.estimated_time) {
                const row = createElement('div', 'detail-row time-estimate');
                row.appendChild(iconSVG("0 0 24 24", "M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2z M12 6v6l4 2"));
                const span = createElement('span');
                const strong = createElement('strong'); strong.textContent = 'الوقت المتوقع للإصلاح:';
                span.appendChild(strong);
                span.appendChild(document.createTextNode(' ' + reason.estimated_time));
                row.appendChild(span);
                details.appendChild(row);
            }
            card.appendChild(details);

            // Footer
            const footer = createElement('div', 'reason-footer');
            const dateSpan = createElement('span');
            dateSpan.appendChild(iconSVG("0 0 24 24", "M19 4H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z M16 2v4 M8 2v4 M3 10h18"));
            dateSpan.appendChild(document.createTextNode(' ' + formatDate(reason.updated_at)));
            footer.appendChild(dateSpan);
            if (!isResolved) {
                const workingSpan = createElement('span');
                workingSpan.style.color = 'var(--warning)';
                workingSpan.appendChild(iconSVG("0 0 24 24", "M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"));
                workingSpan.appendChild(document.createTextNode(' جاري العمل...'));
                footer.appendChild(workingSpan);
            }
            card.appendChild(footer);

            return card;
        }

        function renderReasons(reasons) {
            clearBox();
            if (!reasons || reasons.length === 0) { showEmpty(); return; }
            totalReasonsEl.textContent = `الأسباب: ${reasons.length}`;
            lastUpdateTimeEl.textContent = reasons[0]?.updated_at ? `آخر تحديث: ${formatDate(reasons[0].updated_at)}` : 'آخر تحديث: —';
            reasons.forEach(reason => reasonsBox.appendChild(createReasonCard(reason)));
        }

        async function loadReasons() {
            showLoading();
            try {
                const { data: reasons, error } = await supabase.from('reasons').select('*').order('updated_at', { ascending: false });
                if (error) throw error;
                renderReasons(reasons);
            } catch (error) { console.error(error); showError(); }
        }

        function subscribeToRealtime() {
            try {
                const channel = supabase.channel('reasons-live').on('postgres_changes', { event: '*', schema: 'public', table: 'reasons' }, () => loadReasons()).subscribe();
                window.reasonsChannel = channel;
            } catch (e) { console.warn('Realtime fallback'); }
        }

        loadReasons();
        subscribeToRealtime();
        setInterval(loadReasons, 45000);
    </script>
</body>
</html>
