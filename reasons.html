<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سبب الانقطاع – كهرباء عتق</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif;}

/* نفس خلفية الرئيسية */
body{
  background:linear-gradient(to bottom,#0a0a0a,#111,#1a1a1a,#222);
  min-height:100vh;
  color:white;
  padding:15px;
}

/* عنوان الصفحة */
header{
  text-align:center;
  margin-bottom:25px;
}

header h2{
  font-size:32px;
  font-weight:800;
  color:#1f6feb;
}

/* صندوق عرض الأسباب */
#reason-box{
  display:flex;
  flex-direction:column;
  gap:16px;
  max-width:650px;
  margin:0 auto;
}

/* نفس تصميم الكروت في الرئيسية */
.item{
  background:rgba(255,255,255,0.07);
  padding:18px;
  border-radius:16px;
  backdrop-filter:blur(5px);
  box-shadow:0 6px 18px rgba(0,0,0,0.45);
  border:1px solid #30363d;
  transition:0.25s;
}

.item:hover{
  background:rgba(255,255,255,0.12);
  transform:translateY(-3px);
}

.item p{
  font-size:18px;
  margin-bottom:8px;
  line-height:1.6;
}

.item strong{
  color:#1f6feb;
  font-weight:700;
}

.item small{
  font-size:14px;
  opacity:.8;
  display:block;
  margin-top:10px;
  color:#aaa;
}

/* زر العودة */
.back-btn{
  display:block;
  width:100%;
  max-width:250px;
  margin:25px auto;
  background:#1f6feb;
  color:white;
  text-align:center;
  padding:12px;
  font-size:18px;
  text-decoration:none;
  font-weight:700;
  border-radius:14px;
  transition:0.2s;
  border:none;
  cursor:pointer;
}

.back-btn:hover{
  background:#2b7fff;
  transform:scale(1.05);
}

.no-data{
  text-align:center;
  padding:30px;
  font-size:18px;
  color:#aaa;
  background:rgba(255,255,255,0.05);
  border-radius:12px;
  border:1px dashed #444;
}

.error-message{
  text-align:center;
  padding:30px;
  font-size:18px;
  color:#ff6b6b;
  background:rgba(255,107,107,0.1);
  border-radius:12px;
  border:1px solid #ff6b6b;
}
</style>
</head>

<body>

<header>
  <h2>⚡ أسباب الانقطاع</h2>
  <p style="text-align:center; opacity:0.8; margin-top:10px;">قائمة بأسباب انقطاع الكهرباء المعتمدة من الإدارة</p>
</header>

<div id="reason-box">
  <p style="text-align:center; opacity:0.7;">⏳ جاري تحميل البيانات...</p>
</div>

<a href="index2.html" class="back-btn">⬅ رجوع للرئيسية</a>

<script type="module">
// استيراد Supabase من الملف الخارجي
import { supabase } from './supabase.js';

const box = document.getElementById("reason-box");

// دالة لتحويل التاريخ إلى تنسيق عربي
function formatDate(dateString) {
  if (!dateString) return "—";
  
  try {
    const date = new Date(dateString);
    if (isNaN(date.getTime())) return "تاريخ غير صالح";
    
    return date.toLocaleString("ar-EG", {
      year: "numeric",
      month: "long",
      day: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    });
  } catch (error) {
    console.error("Error formatting date:", error);
    return "—";
  }
}

// دالة لتحميل وعرض أسباب الانقطاع
async function loadReasons() {
  try {
    const { data: reasons, error } = await supabase
      .from('reasons')
      .select('*')
      .order('updated_at', { ascending: false });

    if (error) throw error;

    if (!reasons || reasons.length === 0) {
      box.innerHTML = `
        <div class="no-data">
          <p>📭 لا توجد أسباب مسجلة حالياً</p>
          <small>سيتم إضافة أسباب الانقطاع قريباً من قبل الإدارة</small>
        </div>
      `;
      return;
    }

    let html = '';
    reasons.forEach((reason, index) => {
      if (index === 1) {
        html += `<div style="text-align:center; margin:20px 0; color:#666; font-size:14px;">——— أسباب سابقة ———</div>`;
      }
      
      html += `
        <div class="item">
          <p><strong>السبب:</strong> ${reason.text || "—"}</p>
          ${reason.details ? `<p style="margin-top:8px;"><strong>التفاصيل:</strong> ${reason.details}</p>` : ''}
          ${reason.affected_areas ? `<p style="margin-top:8px;"><strong>المناطق المتأثرة:</strong> ${reason.affected_areas}</p>` : ''}
          ${reason.estimated_time ? `<p style="margin-top:8px; color:#4ecdc4;"><strong>الوقت المتوقع للإصلاح:</strong> ${reason.estimated_time}</p>` : ''}
          <small><strong>آخر تحديث:</strong> ${formatDate(reason.updated_at)}</small>
          ${reason.status ? `<small style="color:${reason.status === 'تم الحل' ? '#2ecc71' : '#f39c12'}"><strong>الحالة:</strong> ${reason.status}</small>` : ''}
        </div>
      `;
    });

    box.innerHTML = html;

  } catch (error) {
    console.error("Error loading reasons:", error);
    box.innerHTML = `
      <div class="error-message">
        <p>⚠️ خطأ في الاتصال بقاعدة البيانات</p>
        <small>يرجى التأكد من اتصالك بالإنترنت والمحاولة مرة أخرى</small>
      </div>
    `;
  }
}

// تحميل البيانات مرة واحدة عند فتح الصفحة فقط
loadReasons();

// ملاحظة: تم حذف دالة subscribeToRealtimeUpdates و setInterval لضمان عدم التحديث التلقائي.
</script>


</body>
</html>
